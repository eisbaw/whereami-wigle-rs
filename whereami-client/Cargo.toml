[package]
name = "whereami-client"
version.workspace = true
edition.workspace = true
publish = false
readme = "README.md"
description = "Typed Rust client for the whereamid Wi-Fi geolocation daemon."
license = "MIT"

[[bin]]
name = "whereami"
path = "src/main.rs"

[lib]
name = "whereami_client"
path = "src/lib.rs"

[build-dependencies]
whereami-build-utils = { path = "../whereami-build-utils" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nu-ansi-term = "0.50"
chrono = "0.4"
# Used only to reset the SIGPIPE disposition to SIG_DFL at startup so the
# CLI behaves like a Unix filter under `| head` (task-0199).
libc = "0.2"
