[package]
name = "whereami-client"
version.workspace = true
edition.workspace = true
publish = false
readme = "README.md"
description = "Typed Rust client for the whereamid Wi-Fi geolocation daemon."
license.workspace = true

[[bin]]
name = "whereami"
path = "src/main.rs"

[lib]
name = "whereami_client"
path = "src/lib.rs"

[build-dependencies]
whereami-build-utils = { path = "../whereami-build-utils" }

[dependencies]
whereami-protocol = { path = "../whereami-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
nu-ansi-term = "0.50"
chrono = { workspace = true }
# Used only to reset the SIGPIPE disposition to SIG_DFL at startup so the
# CLI behaves like a Unix filter under `| head` (task-0199).
libc = { workspace = true }
