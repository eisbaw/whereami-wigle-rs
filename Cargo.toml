[workspace]
members = ["whereamid", "whereami-client", "whereami-build-utils", "whereami-protocol"]
resolver = "2"

# Single source of truth for fields shared by every member crate (task-0260).
# Bump the version here, not in three manifests; the daemon/CLI wire version is
# separate (whereamid::WIRE_VERSION / whereami-client::SUPPORTED_PROTOCOL_VERSION,
# task-0145).
[workspace.package]
version = "0.6.2"
edition = "2021"
license = "MIT"

# Single source of truth for dependency versions shared by >=2 members
# (task-0170). Members reference these with `dep.workspace = true`, so a version
# bump happens here once instead of drifting across manifests. Members that need
# extra features layer them on locally (e.g. whereamid's chrono adds "serde").
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
libc = "0.2"
