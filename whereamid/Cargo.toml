[package]
name = "whereamid"
version = "0.6.2"
edition = "2021"

[[bin]]
name = "whereamid"
path = "src/main.rs"

[lib]
name = "whereamid"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# CancellationToken lives in tokio-util's ungated `pub mod sync`; there is NO
# "sync" feature, so default features suffice. Already in the lock graph as a
# transitive dep (reqwest/hyper), so this only promotes it to a direct dep.
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
proptest = "1.11.0"
# test-util enables tokio's paused clock (`#[tokio::test(start_paused = true)]`)
# for deterministic shutdown-drain / loop-cancellation tests (task-0190). Only
# compiled for tests, so the release binary is unaffected.
tokio = { version = "1", features = ["test-util"] }

# The Kani proof harnesses (src/*.rs `#[cfg(kani)]` modules) are gated on the
# `kani` cfg, which Kani injects at proof time but which is unknown to a normal
# rustc. Declare it so `cargo clippy -- -D warnings` does not reject it via the
# unexpected_cfgs lint. See task-0082 and the `kani` Justfile recipe.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
