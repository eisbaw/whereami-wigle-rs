[package]
name = "whereamid"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "whereamid"
path = "src/main.rs"

[lib]
name = "whereamid"
path = "src/lib.rs"

[build-dependencies]
whereami-build-utils = { path = "../whereami-build-utils" }

[dependencies]
whereami-protocol = { path = "../whereami-protocol" }
tokio = { version = "1", features = ["full"] }
# CancellationToken lives in tokio-util's ungated `pub mod sync`; there is NO
# "sync" feature, so default features suffice. Already in the lock graph as a
# transitive dep (reqwest/hyper), so this only promotes it to a direct dep.
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { workspace = true, features = ["serde"] }
anyhow = { workspace = true }
# Raw fcntl/getsockopt/umask for the socket-activation fd checks and the
# self-bind umask tightening (task-0196 review hardening). Already in the lock
# graph transitively; this only promotes it to a direct dep.
libc = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
# Tests probe sqlite3_txn_state at the exact quota-reservation boundary. Keep
# that bundled-bindings feature out of release builds; `hooks` remains a
# production feature because reader cancellation uses progress_handler.
rusqlite = { version = "0.31", features = ["modern_sqlite"] }
# test-util enables tokio's paused clock (`#[tokio::test(start_paused = true)]`)
# for deterministic shutdown-drain / loop-cancellation tests (task-0190). Only
# compiled for tests, so the release binary is unaffected.
tokio = { version = "1", features = ["test-util"] }

# The Kani proof harnesses (src/*.rs `#[cfg(kani)]` modules) are gated on the
# `kani` cfg, which Kani injects at proof time but which is unknown to a normal
# rustc. Declare it so `cargo clippy -- -D warnings` does not reject it via the
# unexpected_cfgs lint. See task-0082 and the `kani` Justfile recipe.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
